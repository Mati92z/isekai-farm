<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Farming Chronicles</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- 1. INTRO / STORY-BILDSCHIRM -->
    <div id="intro-screen" class="screen">
        <div class="story-box">
            <h2>Göttliches System: "Hoppla..."</h2>
            
            <div class="dialog-container">
                <p id="dialog-text" class="dialog">"Hallo? Kannst du mich hören? Oh je... das ist jetzt echt peinlich."</p>
            </div>
            
            <button id="next-arrow-btn" class="next-arrow-btn">➔</button>
            
            <div id="name-form-group" class="form-group hidden">
                <label for="player-name-input">Wie lautet dein Name in diesem neuen Leben?</label>
                <input type="text" id="player-name-input" value="Mathias">
            </div>
            
            <button id="start-game-btn" class="btn hidden">Neues Leben beginnen! 🌾</button>
        </div>
    </div>

    <!-- 2. DAS EIGENTLICHE SPIEL -->
    <div id="game-screen" class="screen hidden">
        <header class="status-bar">
            <div class="player-info">
                <span id="player-name">Mathias</span> 
                <span class="badge">Lv. <span id="player-level">1</span></span>
            </div>
            <div class="xp-container">
                <span>XP: <span id="player-xp">0</span> / 100</span>
            </div>
            <div class="gold-container">
                <span>Münzen: 💰 <span id="player-gold">100</span></span>
            </div>
        </header>

<div class="tab-navigation">
    <button class="tab-btn active">🌱 Beet</button>
    <button class="tab-btn">🍎 Obst</button>
    <button class="tab-btn">🐔 Tiere</button>
    <button class="tab-btn">⛏️ Mine</button>
    <button class="tab-btn">🍳 Küche</button>
    <button class="tab-btn">⚔️ Gilde</button>
    <button class="tab-btn">🔮 Alchemie</button>
    <button class="tab-btn">👑 Heldinnen</button>
    <button class="tab-btn">📜 Story & Quests</button>
    <button class="tab-btn">⚙️ System</button>
</div>

            <section class="tab-content">
                <div class="content-header">
                    <h3 id="tab-title">Dein Gemüsebeet</h3>
                    <div class="scroll-buttons">
                        <button class="btn-scroll-nav" onclick="scrollMenu('up')">🔼 Hoch</button>
                        <button class="btn-scroll-nav" onclick="scrollMenu('down')">🔽 Runter</button>
                    </div>
                </div>
                <div id="field-section" class="scroll-box-container">
                    <!-- Wird dynamisch befüllt -->
                </div>
            </section>
        </main>
    </div>

    <!-- WICHTIG: Erst die Daten, dann die Logik! -->
   <script src="data.js"></script>
   <script src="heroines.js"></script>
   <script src="story.js"></script>
   <script src="script.js"></script>
</body>
</html>
